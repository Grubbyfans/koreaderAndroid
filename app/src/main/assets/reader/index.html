<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>阅舟阅读器</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #reader { position: fixed; inset: 0; }
        foliate-view { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="__yuezhou_ripple__">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="3" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </svg>
    <div id="reader">
        <foliate-view id="view"></foliate-view>
    </div>
    <script type="module" src="bridge.js"></script>
</body>
</html>
