name: Reader regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the SDK used by the project
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test the reader WebView scripts
        run: node --test tests/*.test.mjs
      - name: Test both Android variants and the shared modules
        run: >-
          ./gradlew --no-daemon --console=plain
          :app:testTtsTestDebugUnitTest :app:testProductionDebugUnitTest
          :core:testDebugUnitTest :reader:testDebugUnitTest
          :speech:testDebugUnitTest :novel-text:test
